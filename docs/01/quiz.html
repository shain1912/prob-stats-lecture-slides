<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1강 웹 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../assets/page.css">
<style>
  .q { font-size: 18px; font-weight: 500; margin-bottom: 14px; white-space: pre-line; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--line); border-radius: 12px;
    padding: 12px 16px; background: #fff; color: var(--ink); font-weight: 500; }
  .opt:hover:not(:disabled) { border-color: var(--red-l); }
  .opt:disabled { opacity: 1; }
  .opt.sel { border-color: var(--red); background: var(--red-bg); }
  .opt.right { border-color: var(--ok); background: var(--ok-bg); }
  .opt.wrong { border-color: var(--red); background: var(--red-bg); text-decoration: line-through; }
  .opt .k { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 14px; }
  .fb { margin-top: 14px; padding: 12px 16px; border-radius: 10px; display: none; }
  .fb.show { display: block; }
  .fb.good { background: var(--ok-bg); }
  .fb.no { background: var(--red-bg); }
  table.dist { border-collapse: collapse; margin: 8px 0 14px; font-size: 17px; }
  table.dist td, table.dist th { border: 1px solid #ccc; padding: 6px 16px; text-align: center; }
  table.dist th { background: #f4f1ee; }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--red); transition: width .3s; }
  .result { text-align: center; padding: 40px 24px; }
  .result .big { font-size: 64px; font-weight: 900; color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="badge">1강</span><h1>웹 퀴즈 · 확률변수와 확률분포</h1>
    <nav><a href="./">슬라이드</a><a href="playground.html">놀이터</a><a href="../">목록</a></nav>
  </header>
  <p class="lede">10문제 · 고르거나 답을 입력한 뒤 “확인” · 분수(3/8)나 소수(0.375) 모두 가능</p>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div id="app"></div>
</div>

<script>
// type: choice(하나 고르기) | multi(모두 고르기) | num(수 입력, 분수 가능)
const QUIZ = [
  { type: 'choice', q: '확률변수(random variable)의 뜻으로 옳은 것',
    opts: ['실험 결과를 글자로 기록한 것', '표본공간의 각 근원사건에 실수 하나를 대응시키는 것', '확률이 항상 0.5인 변수', '사건들을 모은 집합'],
    ans: 1, why: '확률변수 = 근원사건 → 실수. 결과가 H, T 같은 글자여도 확률변수의 값은 실수.' },
  { type: 'multi', q: '100원짜리 동전 3개를 동시에 던질 때, 앞면이 나오는 개수 X가 취할 수 있는 값 (모두 고르기)',
    opts: ['0', '1', '2', '3', '4'], ans: [0, 1, 2, 3], why: '앞면 개수는 0개부터 3개까지 → X = 0, 1, 2, 3. 동전이 3개뿐이므로 4는 불가.' },
  { type: 'choice', q: '다음 중 연속확률변수',
    opts: ['하루 동안 생산된 불량품 수', '주사위를 던져 나온 눈', '부품 길이의 측정값(mm)', '1분 동안 받은 오류 패킷 수'],
    ans: 2, why: '길이 측정값은 어떤 범위의 모든 실수가 가능 → 연속. 나머지는 셀 수 있는 값 → 이산.' },
  { type: 'num', q: '확률변수 X의 확률분포가 다음과 같을 때 a의 값',
    table: [['X', '0', '1', '2', '3', '합계'], ['P(X = x)', '1/8', 'a', '3/8', '1/8', '1']],
    ans: 3 / 8, why: '확률의 합 = 1 → 1/8 + a + 3/8 + 1/8 = 1 → a = 3/8.' },
  { type: 'choice', q: '확률질량함수가 될 수 없는 것 (X가 취하는 값 각각의 확률)',
    opts: ['0.2, 0.3, 0.5', '0.5, 0.5', '0.6, 0.6, −0.2', '0.1, 0.1, 0.8'],
    ans: 2, why: '합은 1이지만 −0.2 < 0 → 성질 ① 0 ≤ p ≤ 1 위반.' },
  { type: 'num', q: '부품 10개 중 불량품 2개. 임의로 3개를 뽑을 때 불량품 수 X에 대하여 P(X = 0)',
    ans: 7 / 15, why: '₈C₃ / ₁₀C₃ = 56 / 120 = 7/15. (참고: P(X=1) = 7/15, P(X=2) = 1/15, 합 = 1)' },
  { type: 'choice', q: '연속확률변수 X에 대하여 P(X = 3)의 값',
    opts: ['0', 'f(3)', '1', '알 수 없음'], ans: 0,
    why: '한 점 위의 넓이 = 0 → 연속확률변수에서 한 점의 확률은 항상 0. f(3)은 확률이 아닌 그래프의 높이.' },
  { type: 'num', q: '10분 간격 지하철. 대기 시간 X(분)의 확률밀도함수 f(x) = 1/10 (0 ≤ x ≤ 10)일 때 P(3 ≤ X ≤ 5)',
    ans: 0.2, why: '직사각형 넓이 = 밑변 2 × 높이 1/10 = 1/5 = 0.2.' },
  { type: 'num', q: 'X의 범위 0 ≤ X ≤ 4, 확률밀도함수 f(x) = kx일 때 상수 k의 값',
    ans: 1 / 8, why: '전체 넓이 = 1 → ½ · 4 · 4k = 8k = 1 → k = 1/8.' },
  { type: 'num', q: '위 문제의 확률밀도함수 f(x) = x/8 (0 ≤ x ≤ 4)에서 P(0 ≤ X ≤ 2)',
    ans: 1 / 4, why: '삼각형 넓이 = ½ · 2 · f(2) = ½ · 2 · 2/8 = 1/4.' },
];

const app = document.getElementById('app');
const bar = document.getElementById('bar');
let idx = 0, score = 0, picked = new Set(), done = false;

function parseNum(s) {
  s = s.trim().replace(/\s/g, '').replace('−', '-');
  const m = s.match(/^(-?\d*\.?\d+)\/(\d*\.?\d+)$/);
  if (m) return parseFloat(m[1]) / parseFloat(m[2]);
  return s === '' ? NaN : Number(s);
}

function render() {
  bar.style.width = `${idx / QUIZ.length * 100}%`;
  if (idx >= QUIZ.length) return renderResult();
  const it = QUIZ[idx];
  picked = new Set(); done = false;
  const table = it.table ? `<table class="dist">${it.table.map((r, i) =>
    `<tr>${r.map(c => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('')}</table>` : '';
  const body = it.type === 'num'
    ? `<div class="controls"><label>답 <input type="text" id="num" inputmode="decimal" placeholder="예: 3/8 또는 0.375" autocomplete="off"></label></div>`
    : `<div class="opts">${it.opts.map((o, i) =>
        `<button class="opt" data-i="${i}"><span class="k">${it.type === 'multi' ? '✓' : i + 1}</span><span>${o}</span></button>`).join('')}</div>`;
  app.innerHTML = `<div class="card">
    <p class="muted">문제 ${idx + 1} / ${QUIZ.length}${it.type === 'multi' ? ' · 모두 고르기' : ''}</p>
    <p class="q">${it.q}</p>${table}${body}
    <div class="controls"><button class="solid" id="check">확인</button><button id="next" hidden>${idx + 1 < QUIZ.length ? '다음 문제 →' : '결과 보기'}</button></div>
    <div class="fb" id="fb" role="status"></div></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (done) return;
    const i = +b.dataset.i;
    if (it.type === 'choice') { picked = new Set([i]); app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', +x.dataset.i === i)); }
    else { picked.has(i) ? picked.delete(i) : picked.add(i); b.classList.toggle('sel'); }
  });
  const num = document.getElementById('num');
  if (num) { num.focus(); num.onkeydown = e => { if (e.key === 'Enter') check(); }; }
  document.getElementById('check').onclick = check;
  document.getElementById('next').onclick = () => { idx++; render(); };
}

function check() {
  if (done) return;
  const it = QUIZ[idx], fb = document.getElementById('fb');
  let ok;
  if (it.type === 'num') {
    const v = parseNum(document.getElementById('num').value);
    if (isNaN(v)) { fb.className = 'fb show no'; fb.textContent = '수를 입력 (분수 3/8 또는 소수 0.375)'; return; }
    ok = Math.abs(v - it.ans) < 1e-3;
  } else {
    if (!picked.size) { fb.className = 'fb show no'; fb.textContent = '보기 선택 필요'; return; }
    const ans = new Set([].concat(it.ans));
    ok = picked.size === ans.size && [...picked].every(i => ans.has(i));
    app.querySelectorAll('.opt').forEach(b => {
      const i = +b.dataset.i; b.disabled = true;
      if (ans.has(i)) b.classList.add('right'); else if (picked.has(i)) b.classList.add('wrong');
    });
  }
  done = true;
  if (ok) score++;
  fb.className = `fb show ${ok ? 'good' : 'no'}`;
  fb.innerHTML = `<b class="${ok ? 'ok' : 'bad'}">${ok ? '정답' : '오답'}</b>${it.type === 'num' && !ok ? ` · 정답 ${fmt(it.ans)}` : ''}<br>${it.why}`;
  document.getElementById('check').hidden = true;
  const next = document.getElementById('next'); next.hidden = false; next.focus();
}

function fmt(v) {
  for (let d = 1; d <= 20; d++) { const n = Math.round(v * d); if (Math.abs(n / d - v) < 1e-9) return d === 1 ? `${n}` : `${n}/${d}`; }
  return v.toFixed(3);
}

function renderResult() {
  bar.style.width = '100%';
  const msg = score === QUIZ.length ? '만점! 확률분포 개념 완벽 이해' : score >= 7 ? '거의 완벽. 틀린 문제만 슬라이드로 복습' : '슬라이드와 놀이터로 복습 후 재도전';
  app.innerHTML = `<div class="card result"><p class="muted">결과</p><p class="big">${score} / ${QUIZ.length}</p><p style="margin:8px 0 24px">${msg}</p>
    <div class="controls" style="justify-content:center"><button class="solid" id="again">다시 풀기</button><a class="btn" href="playground.html">놀이터 가기</a><a class="btn" href="./">슬라이드 복습</a></div></div>`;
  document.getElementById('again').onclick = () => { idx = 0; score = 0; render(); };
}
render();
</script>
</body>
</html>
